name: Firmware build request
description: Build Marlin firmware from an example configuration
title: "Build: "
labels: [build-request]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way to fill this in is from the [configuration picker](https://ellensp.github.io/MarlinWebBuild/).
        A bot will reply here with a download link in a few minutes.
  - type: input
    id: version
    attributes:
      label: Marlin version
      description: "`bugfix-2.1.x`, or a release from the picker, e.g. `2.1.2.9`. Leave blank for `bugfix-2.1.x`."
  - type: input
    id: config
    attributes:
      label: Configuration
      description: Folder under `config/examples` in MarlinFirmware/Configurations, e.g. `Creality/Ender-3/CrealityV422`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Build environment
      description: PlatformIO environment. Leave blank to use the board's default.
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this firmware is built unattended from an example configuration, and I'll check that the configuration matches my printer before flashing.
          required: true
