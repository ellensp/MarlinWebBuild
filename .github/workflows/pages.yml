#
# Rebuild the configuration index and deploy the picker page to GitHub Pages.
#
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      BRANCH: bugfix-2.1.x
    steps:
      - uses: actions/checkout@v7

      - name: Build index
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/MarlinFirmware/Marlin _marlin
          git -C _marlin sparse-checkout set Marlin/src/pins
          git clone -q --depth 1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/MarlinFirmware/Configurations _cfg
          git -C _cfg sparse-checkout set --no-cone '/config/examples/**/Configuration.h'

          python3 tools/marlin_index.py index _marlin _cfg > configs.json
          jq -n --slurpfile c configs.json \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg marlin "$(git -C _marlin rev-parse HEAD)" \
            --arg configs "$(git -C _cfg rev-parse HEAD)" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repo:$repo, branch:$branch, marlin:$marlin, configs:$configs, generated:$generated, items:$c[0]}' \
            > site/index.json
          echo "$(jq '.items | length' site/index.json) configurations indexed"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
