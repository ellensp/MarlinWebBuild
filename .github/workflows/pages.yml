#
# Rebuild the configuration index and deploy the picker page to GitHub Pages.
#
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build indexes
        run: |
          # One index per Marlin version: bugfix-2.1.x and each latest-* release
          python3 tools/marlin_versions.py list > versions.json
          mkdir -p site/index
          echo '[]' > built.json
          for i in $(seq 0 $(( $(jq length versions.json) - 1 ))); do
            v=$(jq -c ".[$i]" versions.json)
            ID=$(jq -r .id <<<"$v"); MREF=$(jq -r .marlin_ref <<<"$v"); CREF=$(jq -r .configs_ref <<<"$v")
            rm -rf _marlin _cfg
            git -c advice.detachedHead=false clone -q --depth 1 --filter=blob:none --sparse -b "$MREF" https://github.com/MarlinFirmware/Marlin _marlin
            git -C _marlin sparse-checkout set Marlin/src/pins
            git -c advice.detachedHead=false clone -q --depth 1 --filter=blob:none --sparse -b "$CREF" https://github.com/MarlinFirmware/Configurations _cfg
            git -C _cfg sparse-checkout set --no-cone '/config/examples/**/Configuration.h'

            python3 tools/marlin_index.py index _marlin _cfg > "site/index/$ID.json"
            jq --argjson v "$v" \
              --arg marlin "$(git -C _marlin rev-parse HEAD)" \
              --arg configs "$(git -C _cfg rev-parse HEAD)" \
              --argjson count "$(jq length "site/index/$ID.json")" \
              '. + [$v + {marlin:$marlin, configs:$configs, count:$count}]' built.json > built.tmp && mv built.tmp built.json
            echo "$ID: $(jq length "site/index/$ID.json") configurations"
          done
          jq -n --slurpfile v built.json \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repo:$repo, generated:$generated, versions:$v[0]}' > site/versions.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
